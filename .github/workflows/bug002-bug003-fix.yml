name: BUG002 WeatherFX + BUG003 Horse candidates

on:
  workflow_dispatch:
  push:
    branches:
      - bug002-bug003-candidate

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [FIX, WFX_PROBE]
    permissions:
      contents: read

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned NDK and Ninja
        run: |
          sdkmanager "ndk;27.3.13750724"
          sudo apt-get update
          sudo apt-get install -y ninja-build
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"


      - name: Build ${{ matrix.variant }}
        run: |
          chmod +x scripts/build-mobilegl-pz-bug002-bug003-android.sh
          scripts/build-mobilegl-pz-bug002-bug003-android.sh \
            "${{ matrix.variant }}" \
            "$RUNNER_TEMP/build-${{ matrix.variant }}" | tee "$RUNNER_TEMP/build-info.txt"

      - name: Package injectable renderer
        run: |
          package_dir="$RUNNER_TEMP/MGLPZ-BUG002-BUG003-${{ matrix.variant }}"
          mkdir -p "$package_dir"
          cp "$RUNNER_TEMP/build-${{ matrix.variant }}/libMobileGLPZ.so" "$package_dir/"
          cp "$RUNNER_TEMP/build-info.txt" "$package_dir/BUILD-INFO.txt"
          readelf -h -d "$package_dir/libMobileGLPZ.so" > "$package_dir/ELF-INFO.txt"
          sha256sum "$package_dir"/* > "$package_dir/SHA256SUMS.txt"
          grep -Fq 'Machine:                           AArch64' "$package_dir/ELF-INFO.txt"
          grep -Fq '(SONAME)' "$package_dir/ELF-INFO.txt"

      - name: Upload ${{ matrix.variant }}
        uses: actions/upload-artifact@v6
        with:
          name: MGLPZ-BUG002-BUG003-${{ matrix.variant }}-ARM64
          path: ${{ runner.temp }}/MGLPZ-BUG002-BUG003-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 14
